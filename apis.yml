aid: dreamscape-immersive
name: Dreamscape Immersive
description: 'Dreamscape Immersive is an entertainment and technology company founded in 2016 and headquartered
  in Culver City, California, that produces story-based, full-roam virtual reality experiences in which
  up to six people share a physical stage and see fully rendered avatars of one another inside a virtual
  3D environment. It operates location-based VR venues in the United States, licenses its platform to
  international operators, and is a partner in the Dreamscape Learn education joint venture. Its public
  surface is a consumer ticketing and booking website; as of August 2026 the company publishes no developer
  portal, API documentation, SDK, or machine-readable specification, and the single backend its website
  calls is a private, key-gated AWS API Gateway host that returns 403 to anonymous requests.'
