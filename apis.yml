    status: 403
  - url: https://dreamscapeimmersive.com/llms.txt
    status: 404
  - url: https://dreamscapeimmersive.com/.well-known/agent-card.json
    status: 404
  - url: https://dreamscapeimmersive.com/robots.txt
    status: 404
