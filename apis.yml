  reason: no-developer-program
  detail: Dreamscape Immersive is a location-based VR venue operator with no developer program at
    all — the two backends its consumer booking site calls, api.techscapevr.com and
    api.hq.dev.techscapevr.com (resolved from REACT_APP_API_DOMAIN in the shipped React bundle), are
    private AWS API Gateway hosts that answer 403 {"message":"Forbidden"} to every anonymous path
    including /openapi.json and /graphql; no developer subdomain exists at all (api., developer.,
    developers., docs. and status..dreamscapeimmersive.com and the techscapevr.com apex all fail DNS),
    and the website itself returns a genuine HTTP 404 for every path except /, /index.html and
    /manifest.json, including /robots.txt, /llms.txt and every /.well-known/ path.
  evidence:
  - url: https://api.techscapevr.com/openapi.json
    status: 403
